services:

  pythia:
    build: .
    container_name: pythia
    restart: unless-stopped
    env_file: .env
    volumes:
      # sources.yaml is read at runtime — mount read-only
      - ./sources.yaml:/app/sources.yaml:ro
      # Event history and source state survive restarts and rebuilds
      - pythia-data:/data
    ports:
      - "${PYTHIA_PORT:-8081}:8000"
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  pythia-data:
