target-version = "py311"
line-length = 100

[lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B904",  # `raise ... from err` — the HTTP handlers deliberately re-raise as HTTPException
    "UP006", "UP007", "UP035", "UP045",  # keep typing.List / Optional used across the codebase
]

[lint.per-file-ignores]
"evaluator.py" = ["E501"]        # the LLM prompts are long literal strings
"tests/*" = ["E501"]
"tests/conftest.py" = ["E402"]   # env vars must be set before the app modules are imported
